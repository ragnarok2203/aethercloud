name: AetherCloud PulseMatrix Automated CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-validate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v3

    - name: Setup Node.js Environment
      uses: actions/setup-node@v3
      with:
        node-version: '20'

    - name: Install Project Dependencies
      run: npm install

    - name: Run Automated Unit Tests (Jest)
      run: npm test

    - name: Validate Terraform Files
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: 1.8.5

    - name: Run Terraform Init & Validate
      run: |
        cd terraform
        terraform init -backend=false
        terraform validate

    - name: Build Docker Container Image
      run: |
        docker build -t aethercloud/pulsematrix:${{ github.sha }} .

    - name: Verify Kubernetes Manifests Syntax
      run: |
        cd kubernetes
        node -e "
          const fs = require('fs');
          const files = fs.readdirSync('.').filter(f => f.endsWith('.yaml') || f.endsWith('.yml'));
          files.forEach(f => {
            const str = fs.readFileSync(f, 'utf8');
            if (!str.includes('apiVersion:') || !str.includes('kind:')) {
              throw new Error('Invalid K8s manifest structure: ' + f);
            }
            console.log('✔ Validated Kubernetes manifest:', f);
          });
        "
