# Prometheus Monitoring Configuration for CloudOps Platform
global:
  scrape_interval:     15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'cloudops-backend-api'
    static_configs:
      - targets: ['cloudops-platform-app:5000']
    metrics_path: '/api/cloud/overview'

  - job_name: 'kubernetes-nodes'
    static_configs:
      - targets: ['10.0.1.42:9100', '10.0.1.43:9100']
