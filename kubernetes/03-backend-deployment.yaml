apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudops-backend-deployment
  namespace: cloudops-system
  labels:
    app: cloudops-backend
    tier: api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: cloudops-backend
  template:
    metadata:
      labels:
        app: cloudops-backend
        tier: api
    spec:
      containers:
      - name: cloudops-container
        image: cloudops/platform-app:1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
          name: http
        envFrom:
        - configMapRef:
            name: cloudops-config
        - secretRef:
            name: cloudops-secrets
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/cloud/overview
            port: 5000
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/cloud/overview
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5
